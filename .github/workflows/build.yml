name: Compila Plugin PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice del repository
      uses: actions/checkout@v4

    - name: Installa Clang e dipendenze Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld cmake make wget unzip git

    - name: Scarica e installa OpenOrbis PS4 Toolchain
      run: |
        mkdir -p /tmp/openorbis
        wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/v0.5.2.tar.gz -O /tmp/oo.tar.gz
        tar -xzf /tmp/oo.tar.gz -C /tmp/openorbis
        echo "OO_PS4_TOOLCHAIN=/tmp/openorbis/PS4Toolchain" >> $GITHUB_ENV

    - name: Scarica e compila GoldHEN Plugins SDK
      run: |
        git clone https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git /tmp/gh_sdk
        cd /tmp/gh_sdk
        export OO_PS4_TOOLCHAIN=/tmp/openorbis/PS4Toolchain
        make
        echo "GOLDHEN_SDK=/tmp/gh_sdk" >> $GITHUB_ENV

    - name: Compila xbox_pad.prx
      run: |
        # Converte eventuali spazi in TAB nel Makefile per sicurezza
        sed -i 's/^   	/\t/g; s/^    /\t/g' Makefile
        make

    - name: Carica il file xbox_pad.prx pronto per il download
      uses: actions/upload-artifact@v4
      with:
        name: Plugin-Compilato-PS4
        path: xbox_pad.prx
