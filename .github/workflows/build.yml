name: Compila Plugin PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice del repository
      uses: actions/checkout@v4

    - name: Installa Clang e dipendenze
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld cmake make wget unzip git dos2unix

    - name: Scarica OpenOrbis PS4 Toolchain
      run: |
        mkdir -p /tmp/openorbis
        wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/v0.5.2.tar.gz -O /tmp/oo.tar.gz
        tar -xzf /tmp/oo.tar.gz -C /tmp/openorbis
        chmod +x /tmp/openorbis/PS4Toolchain/bin/linux/*

    - name: Scarica e compila GoldHEN Plugins SDK
      run: |
        git clone https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git /tmp/gh_sdk
        cd /tmp/gh_sdk
        export OO_PS4_TOOLCHAIN=/tmp/openorbis/PS4Toolchain
        make

    - name: Verifica e compila main.c in xbox_pad.prx
      run: |
        export OO_PS4_TOOLCHAIN=/tmp/openorbis/PS4Toolchain
        export GOLDHEN_SDK=/tmp/gh_sdk

        # Rimuove eventuali estensioni .txt nascoste e caratteri Windows
        if [ -f "main.c.txt" ]; then mv main.c.txt main.c; fi
        dos2unix main.c

        # 1. Compila main.c in main.o
        clang --target=x86_64-pc-freebsd12-elf -fPIC -O2 -Wall \
          -I"$OO_PS4_TOOLCHAIN/include" \
          -I"$GOLDHEN_SDK/include" \
          -c main.c -o main.o

        # 2. Collega le librerie e crea l'ELF
        ld.lld main.o -o xbox_pad.prx.elf \
          -m elf_x86_64 -pie --script "$OO_PS4_TOOLCHAIN/link.x" \
          -e _init --eh-frame-hdr \
          -L"$OO_PS4_TOOLCHAIN/lib" \
          -L"$GOLDHEN_SDK/build" \
          -L"$GOLDHEN_SDK" \
          -lGoldHEN_Hook -lScePad -lScePosix -lkernel

        # 3. Converte in formato firmato PS4 (.prx)
        "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" \
          -in=xbox_pad.prx.elf \
          -out=xbox_pad.prx.oelf \
          --lib=xbox_pad.prx \
          --paid 0x3800000000000011

        mv xbox_pad.prx.oelf xbox_pad.prx

    - name: Carica il file xbox_pad.prx pronto
      uses: actions/upload-artifact@v4
      with:
        name: Plugin-Compilato-PS4
        path: xbox_pad.prx
